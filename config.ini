; Example config file. Feel free to make your own or build upon this one.
; If you're unsure about values in this file, refer to the README.md file at - https://github.com/Mihaugoku/fg-input-visualizer
; I've written explanations, examples and links to anything you could ever need 
[config]
game=ggst
backgroundcolor=#000000
chromakey=1
windowsize=400,180
stickpos=90,90
stickradius=70
opacity=0.85

; Set general keybinds, like movement keys.
; See README.md at - https://github.com/Mihaugoku/fg-input-visualizer for popular inputs.
[keyconfig]
left=Key.left
right=Key.right
up=Key.up
down=Key.down

; Specify all action keys in the game (directional keys are handled differently)
; Basically how you want to call the in-game keys
[overlay.sf6]
keynames=lp,mp,hp,lk,mk,hk

; Specify graphical assets to be used when rendering the buttons. Remember to put sprites in the "assets" folder.
; Structure: keyname=asset_filename.png,x,y
; NOTE: Sprite assets are anchored around their center, not top-left.
; That is - button at 0,0 will draw the center of the sprite at 0,0 (top-left of the window)
[assets.sf6]
lp=btn_0.png,210,58
mp=btn_1.png,274,58
hp=btn_2.png,338,58
lk=btn_3.png,210,122
mk=btn_4.png,274,122
hk=btn_5.png,338,122

; Bind every key to a corresponding button.
[keyconfig.sf6]
lp=a
mp=s
hp=d
lk=z
mk=x
hk=c

; OPTIONAL - Combo keys when pressed, will light up all the buttons mentioned after the "=", separated by a comma
; Example below: Drive Parry and Drive Impact on 'f' and 'v' respectively
[combokeys.sf6]
f=mp,mk
v=hp,hk

; Example game #2 - Guilty Gear: -STRIVE- or something
[overlay.ggst]
keynames=k,p,s,hs,d

[assets.ggst]
p=btn_p.png,210,58
k=btn_k.png,210,122
s=btn_s.png,274,58
hs=btn_hs.png,274,122
d=btn_d.png,338,122

[keyconfig.ggst]
k=x
p=s
s=d
hs=c
d=v

; Roman Cancel or something
; [combokeys.ggst]
; f=k,p,s
